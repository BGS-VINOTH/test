<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoVerse | Creative Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Outfit',sans-serif;
scroll-behavior:smooth;
}

body{

background:#02040d;
overflow-x:hidden;
color:white;

}

/* Background */

body::before{

content:"";

position:fixed;

width:300%;
height:300%;

left:-100%;
top:-100%;

background:

radial-gradient(circle,#4d7cff55 0%,transparent 25%),
radial-gradient(circle,#8d3bff33 0%,transparent 35%),
radial-gradient(circle,#00fff233 0%,transparent 20%);

animation:bg 30s linear infinite;

z-index:-5;

}

@keyframes bg{

100%{

transform:rotate(360deg);

}

}

/* Aurora */

.aurora{

position:fixed;

width:100%;
height:100%;

background:

linear-gradient(120deg,#00fff222,#6b00ff22,#0099ff22,#00fff222);

background-size:400% 400%;

animation:aurora 15s ease infinite;

filter:blur(90px);

z-index:-4;

}

@keyframes aurora{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

/* Stars */

.star{

position:fixed;

width:2px;
height:2px;

background:white;

border-radius:50%;

animation:twinkle 5s infinite;

}

@keyframes twinkle{

50%{

opacity:.1;

transform:scale(3);

}

}

/* Navigation */

nav{

position:fixed;

top:20px;
left:50%;

transform:translateX(-50%);

width:90%;

padding:18px 40px;

display:flex;

justify-content:space-between;

align-items:center;

background:rgba(255,255,255,.04);

backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.08);

border-radius:100px;

z-index:999;

}

.logo{

font-size:28px;

font-weight:900;

letter-spacing:2px;

background:linear-gradient(90deg,#00f0ff,#5f6fff,#ff00aa);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

nav ul{

display:flex;

list-style:none;

gap:35px;

}

nav a{

text-decoration:none;

color:white;

transition:.4s;

font-weight:300;

}

nav a:hover{

color:#00ffff;

}

/* Hero */

.hero{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

padding:40px;

position:relative;

}

/* Floating Glass */

.glass{

position:absolute;

width:500px;
height:500px;

border-radius:50%;

background:rgba(255,255,255,.05);

backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.1);

animation:float 8s ease-in-out infinite;

box-shadow:

0 0 80px rgba(0,255,255,.2),

0 0 180px rgba(132,0,255,.2);

}

@keyframes float{

50%{

transform:

translateY(-30px)

rotate(15deg);

}

}

.hero h1{

font-size:95px;

font-weight:900;

position:relative;

z-index:5;

line-height:1;

text-transform:uppercase;

}

.hero h1 span{

background:

linear-gradient(90deg,#00ffff,#5f6fff,#ff00ff);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.hero p{

margin-top:30px;

font-size:22px;

max-width:700px;

opacity:.75;

position:relative;

z-index:5;

line-height:1.8;

}

/* Button */

.btn{

margin-top:45px;

display:inline-block;

padding:18px 45px;

border-radius:60px;

text-decoration:none;

color:white;

background:linear-gradient(90deg,#00ffff,#5f6fff);

box-shadow:

0 0 40px cyan;

transition:.4s;

position:relative;

z-index:5;

}

.btn:hover{

transform:translateY(-8px) scale(1.05);

box-shadow:

0 0 70px cyan,

0 0 150px #5f6fff;

}

/* Floating Orbs */

.orb{

position:absolute;

border-radius:50%;

filter:blur(20px);

animation:move 15s infinite alternate;

}

.orb:nth-child(1){

width:180px;
height:180px;

background:#00ffff55;

top:20%;

left:8%;

}

.orb:nth-child(2){

width:250px;
height:250px;

background:#6f00ff55;

right:10%;

bottom:20%;

}

.orb:nth-child(3){

width:140px;
height:140px;

background:#ff009955;

bottom:10%;

left:25%;

}

@keyframes move{

100%{

transform:

translateY(-80px)

translateX(60px)

scale(1.3);

}

}

/* Scroll */

.scroll{

position:absolute;

bottom:40px;

font-size:14px;

letter-spacing:6px;

opacity:.5;

animation:bounce 2s infinite;

}

@keyframes bounce{

50%{

transform:translateY(-12px);

}

}

/* Responsive */

@media(max-width:900px){

.hero h1{

font-size:55px;

}

.glass{

width:320px;

height:320px;

}

.hero p{

font-size:18px;

}

nav ul{

display:none;

}

}

</style>

</head>

<body>

<div class="aurora"></div>

<div class="orb"></div>
<div class="orb"></div>
<div class="orb"></div>

<nav>

<div class="logo">NEOVERSE</div>

<ul>

<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Projects</a></li>
<li><a href="#">Contact</a></li>

</ul>

</nav>

<section class="hero">

<div class="glass"></div>

<h1>

DESIGN<br>

<span>THE FUTURE</span>

</h1>

<p>

Not just websites.

I craft immersive digital universes blending futuristic design,
creative motion, elegant interfaces, and unforgettable experiences.

</p>

<a href="#" class="btn">

ENTER MY WORLD

</a>

<div class="scroll">

SCROLL ↓

</div>

</section>

<script>

for(let i=0;i<180;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*5+"s";

s.style.opacity=Math.random();

document.body.appendChild(s);

}

document.addEventListener("mousemove",(e)=>{

let x=(e.clientX/window.innerWidth-.5)*30;

let y=(e.clientY/window.innerHeight-.5)*30;

document.querySelector(".glass").style.transform=`translate(${x}px,${y}px)`;

});

</script>

</body>
</html>
